# Cloudflare Worker config with separate dev and production environments.
# Each environment is its own Worker with its own URL, so testing in dev never touches production.
# The app has no database: games and settings are kept in each player's own browser.

name = "knight-school-local"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# No APP_ENV here: a deploy that skips --env (such as a Cloudflare dashboard build) is
# treated as production, so it can never put a test banner on the live site.
# `npm run dev` sets APP_ENV=local for your own machine.

# ---------- dev ----------
[env.dev]
name = "knight-school-dev"
workers_dev = true
vars = { APP_ENV = "dev" }

# ---------- production ----------
[env.production]
name = "knight-school"
workers_dev = true
vars = { APP_ENV = "production" }
